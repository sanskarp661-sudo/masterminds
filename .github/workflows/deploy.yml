name: Deploy to Hostinger

# Uploads the website to Hostinger over FTP on every push to main.
# One-time setup (repo → Settings → Secrets and variables → Actions → New repository secret):
#   FTP_SERVER    e.g. ftp.mymasterminds.in or the IP shown in hPanel → Files → FTP Accounts
#   FTP_USERNAME  e.g. u123456789.mymasterminds.in
#   FTP_PASSWORD  your FTP password
#   FTP_DIR       (optional) folder to upload into, default: public_html/
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check FTP secrets
        id: check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "::warning::FTP secrets are not set yet, so nothing was deployed. See SETUP.md, step 4."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - name: Upload to Hostinger
        if: steps.check.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR || 'public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            database/**
            **/*.md
            .nojekyll
