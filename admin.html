<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin · Master Minds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f7f5f0; --surface:#fff; --surface-2:#f3f0e8; --chip:#ece8df; --input:#faf9f6;
  --line:#e6e2d9; --line-2:#efebe3; --input-line:#ddd8cd;
  --ink:#1a1d29; --ink-2:#2b2f3d; --muted:#5b6070;
  --navy:#16203f; --navy-2:#24305a; --navy-deep:#0f1730;
  --gold:#f2b33d; --gold-2:#e5a322; --gold-ink:#b97c0c;
  --green:#1f6b45; --green-bg:#e3f2e9; --red:#b42318; --red-bg:#fdecea; --blue:#1d4ed8; --blue-bg:#e6edfd;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Instrument Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-size:15px}
h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;margin:0;color:var(--navy);letter-spacing:-.01em}
a{color:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-mark{width:36px;height:36px;border-radius:10px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font:700 15px 'Bricolage Grotesque',sans-serif;flex:none}
.logo-text{font:700 18px 'Bricolage Grotesque',sans-serif;color:#fff;white-space:nowrap}
.logo-text small{display:block;font:600 11px 'Instrument Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}

/* buttons & inputs */
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;text-decoration:none;font-size:14px}
.btn:disabled{opacity:.6;cursor:wait}
.btn-navy{background:var(--navy);color:#fff}.btn-navy:hover{background:var(--navy-2)}
.btn-gold{background:var(--gold);color:var(--navy)}.btn-gold:hover{background:var(--gold-2)}
.btn-line{background:var(--surface);border:1px solid var(--line);color:var(--navy)}.btn-line:hover{border-color:var(--navy)}
.btn-sm{padding:7px 12px;font-size:13px}
.btn-danger{background:var(--surface);border:1px solid var(--line);color:var(--red)}.btn-danger:hover{background:var(--red-bg);border-color:#f3b8b2}
.icon-btn{width:34px;height:34px;padding:0;justify-content:center}
.input,select.input,textarea.input{width:100%;border:1px solid var(--input-line);border-radius:10px;padding:10px 12px;background:var(--input);outline-color:var(--gold)}
textarea.input{min-height:96px;resize:vertical;line-height:1.5}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
label.f .hint{font-weight:400;color:var(--muted);font-size:12px}
.switch{position:relative;display:inline-block;width:40px;height:22px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#cfcabe;border-radius:999px;cursor:pointer;transition:.2s}
.switch span::after{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}

/* auth screens */
.center{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--navy-deep)}
.auth{width:100%;max-width:420px;background:var(--surface);border-radius:24px;padding:32px;display:flex;flex-direction:column;gap:18px}
.auth .logo-text{color:var(--navy)}
.auth p{margin:0;color:var(--muted);line-height:1.55}
.auth ol{margin:0;padding-left:20px;color:var(--ink-2);line-height:1.7}
.auth code{background:var(--surface-2);padding:2px 6px;border-radius:6px;font-size:13px}
.msg{border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.5}
.msg.err{background:var(--red-bg);color:var(--red)}
.msg.info{background:var(--surface-2);color:var(--ink-2)}

/* shell */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:var(--navy-deep);color:#c9cde0;padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.side nav{display:flex;flex-direction:column;gap:4px}
.side nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-weight:600;color:#c9cde0}
.side nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.side nav button.on{background:var(--gold);color:var(--navy)}
.side nav button:focus-visible{outline:2px solid var(--gold)}
.side svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nbadge{margin-left:auto;background:#e5484d;color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:2px 7px}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:13px}
.side .foot a,.side .foot button{all:unset;cursor:pointer;color:#c9cde0;padding:8px 12px;border-radius:10px;display:flex;gap:10px;align-items:center}
.side .foot a:hover,.side .foot button:hover{color:#fff;background:rgba(255,255,255,.06)}
.side .who{padding:0 12px;color:#8d93ad;word-break:break-all}
main{padding:28px clamp(16px,3vw,40px) 80px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head h1{font-size:30px}
.head p{margin:4px 0 0;color:var(--muted)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .input{width:auto;min-width:200px;flex:1;max-width:340px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px}
.empty{padding:48px 24px;text-align:center;color:var(--muted)}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;height:auto;z-index:10;padding:12px 16px;gap:10px;flex-direction:row;align-items:center;overflow-x:auto}
  .side .logo-text{display:none}
  .side nav{flex-direction:row}
  .side nav button{padding:8px 10px;white-space:nowrap}
  .side nav button .lbl{display:none}
  .side nav button.on .lbl{display:inline}
  .side .foot{margin:0 0 0 auto;flex-direction:row}
  .side .who{display:none}
  .side .foot .lbl{display:none}
}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.stat:hover{border-color:var(--navy)}
.stat.on{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.stat strong{font:700 28px 'Bricolage Grotesque',sans-serif;color:var(--navy)}
.stat span{font-size:13px;color:var(--muted);font-weight:600}

/* table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:820px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle;font-size:14px}
th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface-2)}
th:first-child{border-top-left-radius:18px}th:last-child{border-top-right-radius:18px}
tr:last-child td{border-bottom:0}
td .sub{display:block;color:var(--muted);font-size:13px;margin-top:2px}
td.actions{white-space:nowrap;text-align:right}
td.actions .btn+.btn{margin-left:6px}
.status{border:0;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:700;cursor:pointer}
.st-new{background:var(--blue-bg);color:var(--blue)}
.st-contacted{background:#fdf0d5;color:#8a5300}
.st-enrolled{background:var(--green-bg);color:var(--green)}
.st-closed{background:var(--chip);color:var(--muted)}
.thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;background:var(--chip);display:grid;place-items:center;font:700 13px 'Bricolage Grotesque',sans-serif;color:var(--muted);flex:none}
.row-main{display:flex;gap:12px;align-items:center}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.pill.in{background:var(--green-bg);color:var(--green)}.pill.ab{background:#fdf0d5;color:#8a5300}
.note{max-width:220px;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quote{max-width:420px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* gallery */
.drop{border:2px dashed var(--input-line);border-radius:18px;padding:28px;text-align:center;color:var(--muted);background:var(--surface);cursor:pointer;margin-bottom:18px;display:block}
.drop:hover,.drop.over{border-color:var(--navy);color:var(--navy)}
.drop strong{color:var(--navy)}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.gitem{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.gitem img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--chip);display:block}
.gitem .gb{padding:12px;display:flex;flex-direction:column;gap:10px}
.gitem .gr{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:13px;color:var(--muted)}
.gitem .gr input[type=number]{width:70px}

/* content form */
.cform{display:flex;flex-direction:column;gap:18px;max-width:920px}
.cgroup{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px}
.cgroup h2{font-size:19px}
.cgroup>p{margin:-6px 0 0;color:var(--muted);font-size:13px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.rep{display:grid;grid-template-columns:160px 1fr 200px 34px;gap:8px;align-items:start}
@media (max-width:760px){.rep{grid-template-columns:1fr}}
.savebar{position:sticky;bottom:16px;display:flex;justify-content:flex-end;gap:10px;background:rgba(247,245,240,.9);backdrop-filter:blur(6px);padding:10px;border-radius:999px;border:1px solid var(--line)}

/* image field */
.imgf{display:flex;gap:12px;align-items:center}
.imgf img{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--chip);flex:none}
.imgf .col{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.imgf .row{display:flex;gap:6px;flex-wrap:wrap}

/* dialog */
dialog{border:0;border-radius:22px;padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 32px);box-shadow:0 30px 80px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(15,23,48,.55)}
dialog form{display:flex;flex-direction:column;gap:14px;padding:26px}
dialog .dh{display:flex;justify-content:space-between;align-items:center}
dialog .df{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
.check{display:flex;gap:10px;align-items:center;font-weight:600;font-size:14px}

/* toast */
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:100}
.toast{background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:360px}
.toast.err{background:var(--red)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- First run / not configured -->
<div class="center hidden" id="setupScreen">
  <form class="auth" id="setupForm">
    <div class="logo"><span class="logo-mark">MM</span><span class="logo-text">Master Minds<small>Admin</small></span></div>
    <div id="setupBody"></div>
  </form>
</div>

<!-- Login -->
<div class="center hidden" id="loginScreen">
  <form class="auth" id="loginForm">
    <div class="logo"><span class="logo-mark">MM</span><span class="logo-text">Master Minds<small>Admin</small></span></div>
    <h2>Sign in</h2>
    <div class="msg err hidden" id="loginErr"></div>
    <label class="f">Email<input class="input" type="email" name="email" required autocomplete="username"></label>
    <label class="f">Password<input class="input" type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn btn-navy" type="submit" style="justify-content:center;padding:13px">Sign in</button>
    <p style="font-size:13px"><a href="./">← Back to website</a></p>
  </form>
</div>

<!-- App -->
<div class="shell hidden" id="appScreen">
  <aside class="side">
    <a class="logo" href="./" target="_blank" rel="noopener"><span class="logo-mark">MM</span><span class="logo-text">Master Minds<small>Admin</small></span></a>
    <nav id="nav"></nav>
    <div class="foot">
      <span class="who" id="who"></span>
      <a href="./" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg><span class="lbl">View website</span></a>
      <button id="logout"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span class="lbl">Sign out</span></button>
    </div>
  </aside>
  <main id="view"></main>
</div>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<div id="toasts" role="status" aria-live="polite"></div>
<input type="file" id="filePick" accept="image/*" class="hidden">

<script src="config.js"></script>
<script>
(function(){
'use strict';
const CFG = window.MM_CONFIG || {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(String(u||'').trim()) ? esc(String(u).trim()) : '';
const initials = n => esc(String(n||'').split(/\s+/).filter(Boolean).map(w=>w[0]).join('').slice(0,3).toUpperCase());
const show = id => ['setupScreen','loginScreen','appScreen'].forEach(x => $('#'+x).classList.toggle('hidden', x!==id));

const PROGRAMS = [['','— None —'],['mba','MBA'],['law','Law'],['ipm','IPM'],['bba','BBA'],['cuet','CUET'],['hotel-management','Hotel Management'],
  ['gmat','GMAT'],['gre','GRE'],['sat','SAT'],['ielts','IELTS'],['toefl','TOEFL'],['pte','PTE'],['study-abroad','Study Abroad']];
const progName = slug => (PROGRAMS.find(p => p[0]===slug)||[])[1] || slug || '';
const STATUSES = ['new','contacted','enrolled','closed'];

function toast(msg, err){
  const t = document.createElement('div'); t.className = 'toast'+(err?' err':''); t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), err ? 6000 : 3000);
}
const fail = (err, what) => { console.error(err); toast((what?what+': ':'')+(err && err.message || 'Something went wrong'), true); };

const API = CFG.apiBase || '';
async function api(action, payload, opts){
  opts = opts || {};
  let init = {credentials: API.startsWith('http') ? 'include' : 'same-origin'};
  if (payload instanceof FormData) init = Object.assign(init, {method:'POST', headers:{'X-MM':'1'}, body:payload});
  else if (payload) init = Object.assign(init, {method:'POST', headers:{'Content-Type':'application/json','X-MM':'1'}, body:JSON.stringify(payload)});
  const res = await fetch(API + 'index.php?a=' + action + (opts.query ? '&' + new URLSearchParams(opts.query) : ''), init);
  let data = null; try { data = await res.json(); } catch {}
  if (res.status === 401 && !opts.auth) { show('loginScreen'); throw new Error((data && data.error) || 'Please sign in again.'); }
  if (!res.ok || !data) throw new Error((data && data.error) || (res.status === 404 ? 'The api folder was not found on the server.' : 'Server error ('+res.status+')'));
  return data;
}
const guard = (fn, what) => async (...a) => { try { return await fn(...a); } catch (err) { fail(err, what); } };

/* ---------------- auth ---------------- */
function setupMessage(html){ $('#setupBody').innerHTML = html; show('setupScreen'); }
async function boot(){
  if (!API) return setupMessage(`<h2>Live features are off</h2><p><code>config.js</code> has no <code>apiBase</code>. See <code>SETUP.md</code>.</p>`);
  let st;
  try { st = await api('status', null, {auth:true}); }
  catch (err) {
    return setupMessage(`<h2>Can't reach the server</h2><div class="msg err">${esc(err.message)}</div>
      <p>Check that the website is uploaded to Hostinger with the <code>api</code> folder, that <code>mm-config.php</code> has your database details, and that <code>database/schema.sql</code> was imported. Full steps are in <code>SETUP.md</code>.</p>
      <button type="button" class="btn btn-navy" onclick="location.reload()" style="justify-content:center">Try again</button>`);
  }
  if (st.needsSetup){
    setupMessage(`<h2>Create the first admin</h2><p>No admin account exists yet. The account you create now can add more admins later. This page only works once.</p>
      <div class="msg err hidden" id="setupErr"></div>
      <label class="f">Your name<input class="input" name="name" autocomplete="name" maxlength="120"></label>
      <label class="f">Email<input class="input" type="email" name="email" required autocomplete="username"></label>
      <label class="f">Password <span class="hint">at least 8 characters</span><input class="input" type="password" name="password" required minlength="8" autocomplete="new-password"></label>
      <button class="btn btn-navy" type="submit" style="justify-content:center;padding:13px">Create admin &amp; sign in</button>`);
    return;
  }
  if (!st.admin) return show('loginScreen');
  enterApp(st.admin);
}
function enterApp(admin){
  me = admin;
  $('#who').textContent = admin.email;
  show('appScreen');
  renderNav(); go(location.hash.slice(1) || 'inquiries');
  refreshBadge();
}
let me = null;
$('#setupForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector('button[type=submit]'), errEl = $('#setupErr');
  if (!btn) return;
  errEl.classList.add('hidden'); btn.disabled = true;
  try { const r = await api('setup', {name:f.name.value, email:f.email.value, password:f.password.value}, {auth:true}); enterApp(r.admin); toast('Admin account created'); }
  catch (err) { errEl.textContent = err.message; errEl.classList.remove('hidden'); }
  btn.disabled = false;
});
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector('button'), errEl = $('#loginErr');
  errEl.classList.add('hidden'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Signing in…';
  try { const r = await api('login', {email:f.email.value.trim(), password:f.password.value}, {auth:true}); f.password.value = ''; enterApp(r.admin); }
  catch (err) { errEl.textContent = err.message; errEl.classList.remove('hidden'); }
  btn.disabled = false; btn.textContent = 'Sign in';
});
$('#logout').onclick = async () => { try { await api('logout', {}, {auth:true}); } catch {} location.hash = ''; show('loginScreen'); };

/* ---------------- nav ---------------- */
const VIEWS = [
  ['inquiries','Form Submissions','<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>'],
  ['results','Results','<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0 0 12 0V2Z"/>'],
  ['testimonials','Reviews','<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>'],
  ['gallery','Gallery','<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21"/>'],
  ['content','Website Content','<path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>'],
  ['admins','Admins & Password','<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>']
];
let current = 'inquiries', newCount = 0;
function renderNav(){
  $('#nav').innerHTML = VIEWS.map(([k,l,ic]) => `<button data-view="${k}" class="${k===current?'on':''}"><svg viewBox="0 0 24 24">${ic}</svg><span class="lbl">${l}</span>${k==='inquiries'&&newCount?`<span class="nbadge">${newCount}</span>`:''}</button>`).join('');
}
$('#nav').addEventListener('click', e => { const b = e.target.closest('[data-view]'); if (b) go(b.dataset.view); });
function go(v){

/* ---------------- uploads ---------------- */
async function uploadImage(file, folder){
  if (!file.type.startsWith('image/')) throw new Error(file.name+' is not an image');
  if (file.size > 5*1024*1024) throw new Error(file.name+' is larger than 5 MB');
  const fd = new FormData(); fd.append('file', file); fd.append('folder', folder);
  return (await api('upload', fd)).url;
}
function pickFile(multiple){
  return new Promise(res => {
    const inp = $('#filePick'); inp.multiple = !!multiple; inp.value = '';
    inp.onchange = () => res([...inp.files]); inp.click();
  });
}

/* ---------------- dialog form ---------------- */
function fieldHtml(f, v){
  const val = v ?? f.default ?? '';
  const req = f.required ? 'required' : '';
  const lbl = `${esc(f.label)}${f.required?' *':''}${f.hint?` <span class="hint">${esc(f.hint)}</span>`:''}`;
  if (f.type==='checkbox') return `<label class="check"><span class="switch"><input type="checkbox" name="${f.name}" ${val?'checked':''}><span></span></span>${esc(f.label)}</label>`;
  if (f.type==='textarea') return `<label class="f">${lbl}<textarea class="input" name="${f.name}" ${req} maxlength="${f.max||2000}">${esc(val)}</textarea></label>`;
  if (f.type==='select') return `<label class="f">${lbl}<select class="input" name="${f.name}" ${req}>${f.options.map(([k,l]) => `<option value="${esc(k)}" ${String(k)===String(val)?'selected':''}>${esc(l)}</option>`).join('')}</select></label>`;
  if (f.type==='image') return `<div class="f"><label class="f" style="gap:6px">${lbl}</label><div class="imgf" data-img="${f.name}">
      <img src="${safeUrl(val)}" alt="" onerror="this.removeAttribute('src')">
      <div class="col"><input class="input" name="${f.name}" value="${esc(val)}" placeholder="Image URL or upload">
      <div class="row"><button type="button" class="btn btn-line btn-sm" data-upload="${f.folder||'misc'}">Upload photo</button><button type="button" class="btn btn-line btn-sm" data-clear>Remove</button></div></div></div></div>`;
  return `<label class="f">${lbl}<input class="input" type="${f.type||'text'}" name="${f.name}" value="${esc(val)}" ${req} maxlength="${f.max||300}"></label>`;
}
function wireImageFields(root){
  root.querySelectorAll('[data-img]').forEach(box => {
    const inp = box.querySelector('input'), img = box.querySelector('img');
    const sync = () => { const u = safeUrl(inp.value); u ? img.src = inp.value.trim() : img.removeAttribute('src'); };
    inp.addEventListener('input', sync);
    box.querySelector('[data-clear]').onclick = () => { inp.value = ''; sync(); };
    box.querySelector('[data-upload]').onclick = async e => {
      const btn = e.currentTarget, [file] = await pickFile(false); if (!file) return;
      btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Uploading';
      try { inp.value = await uploadImage(file, btn.dataset.upload); sync(); toast('Photo uploaded'); }
      catch (err) { fail(err, 'Upload failed'); }
      btn.disabled = false; btn.textContent = 'Upload photo';
    };
  });
}
function openForm(title, fields, values, onSave){
  const form = $('#dlgForm');
  form.innerHTML = `<div class="dh"><h2>${esc(title)}</h2><button type="button" class="btn btn-line icon-btn" data-close aria-label="Close">✕</button></div>
    ${fields.map(f => fieldHtml(f, values[f.name])).join('')}
    <div class="df"><button type="button" class="btn btn-line" data-close>Cancel</button><button type="submit" class="btn btn-navy">Save</button></div>`;
  wireImageFields(form);
  form.querySelectorAll('[data-close]').forEach(b => b.onclick = () => $('#dlg').close());
  form.onsubmit = async e => {
    e.preventDefault();
    const out = {};
    fields.forEach(f => {
      const el = form.elements[f.name];
      out[f.name] = f.type==='checkbox' ? el.checked : f.type==='number' ? (parseInt(el.value,10)||0) : (el.value.trim() || null);
    });
    const btn = form.querySelector('[type=submit]'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Saving';
    const ok = await onSave(out);
    btn.disabled = false; btn.textContent = 'Save';
    if (ok) $('#dlg').close();
  };
  $('#dlg').showModal();
}

let inq = [], inqFilter = 'all', inqSearch = '';
async function viewInquiries(){
  try { inq = (await api('inquiries')).rows; } catch (err) { return fail(err, 'Could not load submissions'); }
  drawInquiries();
}
function inqRows(){
  const q = inqSearch.toLowerCase();
  return inq.filter(r => (inqFilter==='all' || r.status===inqFilter) &&
    (!q || [r.name,r.phone,r.email,r.city,r.course,r.notes].some(x => String(x||'').toLowerCase().includes(q))));
}
const fmtDate = d => new Date(d).toLocaleString('en-IN', {day:'numeric', month:'short', year:'numeric', hour:'numeric', minute:'2-digit'});
function drawInquiries(){
  const count = s => inq.filter(r => r.status===s).length;
  const rows = inqRows();
  $('#view').innerHTML = `
  <div class="head"><div><h1>Form Submissions</h1><p>Enquiries sent from the “Book Your Free Counseling Session” form.</p></div>
    <div style="display:flex;gap:8px"><button class="btn btn-line" id="inqRefresh">Refresh</button><button class="btn btn-gold" id="inqCsv">Export CSV</button></div></div>
  <div class="stats">
    ${[['all','All',inq.length],['new','New',count('new')],['contacted','Contacted',count('contacted')],['enrolled','Enrolled',count('enrolled')],['closed','Closed',count('closed')]]
      .map(([k,l,n]) => `<button class="stat ${inqFilter===k?'on':''}" data-filter="${k}"><strong>${n}</strong><span>${l}</span></button>`).join('')}
  </div>
  <div class="toolbar"><input class="input" id="inqSearch" placeholder="Search name, phone, email, city, course…" value="${esc(inqSearch)}"></div>
  <div class="panel">${rows.length ? `<div class="tbl-wrap"><table>
    <thead><tr><th>Received</th><th>Student</th><th>Contact</th><th>City</th><th>Course</th><th>Status</th><th>Notes</th><th></th></tr></thead>
    <tbody>${rows.map(r => `<tr data-id="${r.id}">
      <td style="white-space:nowrap">${esc(fmtDate(r.created_at))}</td>
      <td><b>${esc(r.name)}</b></td>
      <td><a href="tel:${esc(r.phone)}">${esc(r.phone)}</a>${r.email?`<span class="sub"><a href="mailto:${esc(r.email)}">${esc(r.email)}</a></span>`:''}</td>
      <td>${esc(r.city)}</td><td>${esc(r.course)}</td>
      <td><select class="status st-${r.status}" data-status aria-label="Status">${STATUSES.map(s => `<option value="${s}" ${s===r.status?'selected':''}>${s[0].toUpperCase()+s.slice(1)}</option>`).join('')}</select></td>
      <td><div class="note" title="${esc(r.notes)}">${esc(r.notes) || '<span style="opacity:.6">—</span>'}</div></td>
      <td class="actions"><button class="btn btn-line btn-sm" data-note>Note</button><button class="btn btn-danger btn-sm" data-del>Delete</button></td>

  </div>`;
  $('#inqRefresh').onclick = () => { viewInquiries(); refreshBadge(); };
  $('#inqCsv').onclick = exportCsv;
  const s = $('#inqSearch'); s.oninput = () => { inqSearch = s.value; const pos = s.selectionStart; drawInquiries(); const n = $('#inqSearch'); n.focus(); n.setSelectionRange(pos,pos); };
  $('#view').querySelectorAll('[data-filter]').forEach(b => b.onclick = () => { inqFilter = b.dataset.filter; drawInquiries(); });
  $('#view').querySelectorAll('tr[data-id]').forEach(tr => {
    const r = inq.find(x => String(x.id)===tr.dataset.id);
    tr.querySelector('[data-status]').onchange = async e => {
      const status = e.target.value, prev = r.status;
      try { await api('inquiry_update', {id:r.id, status}); } catch (err) { e.target.value = prev; return fail(err, 'Could not update'); }

      try { await api('inquiry_update', {id:r.id, notes:v.notes}); } catch (err) { fail(err, 'Could not save note'); return false; }
      r.notes = v.notes; drawInquiries(); toast('Note saved'); return true;
    });
    tr.querySelector('[data-del]').onclick = async () => {
      if (!confirm(`Delete the enquiry from ${r.name}? This cannot be undone.`)) return;
      try { await api('inquiry_delete', {id:r.id}); } catch (err) { return fail(err, 'Could not delete'); }
      inq = inq.filter(x => x.id!==r.id); drawInquiries(); toast('Deleted'); refreshBadge();
    };
  });
}
function exportCsv(){
  const rows = inqRows(), cols = ['created_at','name','phone','email','city','course','status','notes'];
  const cell = v => { let s = String(v ?? ''); if (/^[=+\-@]/.test(s)) s = "'"+s; return '"'+s.replace(/"/g,'""')+'"'; };
  const csv = [cols.join(','), ...rows.map(r => cols.map(c => cell(c==='created_at' ? fmtDate(r[c]) : r[c])).join(','))].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿'+csv], {type:'text/csv'}));
  a.download = `masterminds-enquiries-${new Date().toISOString().slice(0,10)}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

const collState = {results:{rows:[], q:''}, testimonials:{rows:[], q:''}};
async function viewCollection(key){
  try { collState[key].rows = (await api('list', null, {query:{t:key}})).rows; } catch (err) { return fail(err, 'Could not load '+COLL[key].title.toLowerCase()); }
  drawCollection(key);
}
function drawCollection(key){
  const c = COLL[key], st = collState[key], q = st.q.toLowerCase();
  const rows = st.rows.filter(r => !q || c.search(r).toLowerCase().includes(q));
  $('#view').innerHTML = `
  <div class="head"><div><h1>${c.title}</h1><p>${c.desc}</p></div><button class="btn btn-gold" id="addBtn">+ Add ${c.singular.toLowerCase()}</button></div>
  <div class="toolbar"><input class="input" id="collSearch" placeholder="Search ${c.title.toLowerCase()}…" value="${esc(st.q)}"><span style="color:var(--muted);font-size:14px">${st.rows.filter(r=>r.published).length} shown on website · ${st.rows.length} total</span></div>
  <div class="panel">${rows.length ? `<div class="tbl-wrap"><table>
    <thead><tr><th>${c.singular}</th><th>Category</th><th>Order</th><th>On website</th><th></th></tr></thead>
    <tbody>${rows.map(r => `<tr data-id="${r.id}">
      <td>${c.main(r)}</td><td>${c.meta(r)}</td><td>${r.sort}</td>
      <td><label class="switch" title="Show on website"><input type="checkbox" data-pub ${r.published?'checked':''}><span></span></label></td>
      <td class="actions"><button class="btn btn-line btn-sm" data-edit>Edit</button><button class="btn btn-danger btn-sm" data-del>Delete</button></td></tr>`).join('')}
    </tbody></table></div>` : `<div class="empty">${st.rows.length ? 'Nothing matches your search.' : `No ${c.title.toLowerCase()} yet. Click “Add ${c.singular.toLowerCase()}” to create one.`}</div>`}</div>`;
  const s = $('#collSearch'); s.oninput = () => { st.q = s.value; const pos = s.selectionStart; drawCollection(key); const n = $('#collSearch'); n.focus(); n.setSelectionRange(pos,pos); };
  $('#addBtn').onclick = () => {
    const next = st.rows.reduce((m,r) => Math.max(m, r.sort||0), 0) + 1;
    openForm('Add '+c.singular.toLowerCase(), c.fields, {sort:next}, async v => {
      let data; try { data = (await api('save', v, {query:{t:key}})).row; } catch (err) { fail(err, 'Could not save'); return false; }
      st.rows.push(data); st.rows.sort((a,b) => a.sort-b.sort); drawCollection(key); toast(c.singular+' added'); return true;
    });
  };
  $('#view').querySelectorAll('tr[data-id]').forEach(tr => {
    const r = st.rows.find(x => String(x.id)===tr.dataset.id);
    tr.querySelector('[data-pub]').onchange = async e => {
      try { await api('save', {id:r.id, published:e.target.checked}, {query:{t:key}}); } catch (err) { e.target.checked = !e.target.checked; return fail(err, 'Could not update'); }
      r.published = e.target.checked; toast(r.published ? 'Now shown on website' : 'Hidden from website'); drawCollection(key);
    };
    tr.querySelector('[data-edit]').onclick = () => openForm('Edit '+c.singular.toLowerCase(), c.fields, r, async v => {
      let data; try { data = (await api('save', Object.assign({id:r.id}, v), {query:{t:key}})).row; } catch (err) { fail(err, 'Could not save'); return false; }
      Object.assign(r, data); st.rows.sort((a,b) => a.sort-b.sort); drawCollection(key); toast('Saved'); return true;
    });
    tr.querySelector('[data-del]').onclick = async () => {
      if (!confirm(`Delete this ${c.singular.toLowerCase()}? This cannot be undone.`)) return;
      try { await api('delete', {id:r.id}, {query:{t:key}}); } catch (err) { return fail(err, 'Could not delete'); }
      st.rows = st.rows.filter(x => x.id!==r.id); drawCollection(key); toast('Deleted');
    };
  });
}

/* ---------------- gallery ---------------- */
let gal = [];
async function viewGallery(){
  try { gal = (await api('list', null, {query:{t:'gallery'}})).rows; } catch (err) { return fail(err, 'Could not load gallery'); }
  drawGallery();
}
function drawGallery(){
  $('#view').innerHTML = `
  <div class="head"><div><h1>Gallery</h1><p>Photos shown in “Our Students Around the World”. ${gal.filter(g=>g.published).length} of ${gal.length} shown on website.</p></div></div>
  <label class="drop" id="drop" tabindex="0"><strong>Click to upload photos</strong> or drag them here<br><span style="font-size:13px">JPG, PNG or WebP · up to 5 MB each · several at once is fine</span></label>
  ${gal.length ? `<div class="ggrid">${gal.map(g => `<div class="gitem" data-id="${g.id}">
    <img src="${safeUrl(g.url)}" alt="" loading="lazy">
    <div class="gb"><input class="input" data-cap placeholder="Caption (optional)" value="${esc(g.caption)}" maxlength="120">
      <div class="gr"><label style="display:flex;gap:6px;align-items:center">Order <input class="input" type="number" data-sort value="${g.sort}" style="padding:6px 8px"></label>
        <label style="display:flex;gap:6px;align-items:center" title="Show on website"><span class="switch"><input type="checkbox" data-pub ${g.published?'checked':''}><span></span></span></label></div>
      <button class="btn btn-danger btn-sm" data-del style="justify-content:center">Delete photo</button></div></div>`).join('')}</div>`
    : '<div class="panel empty">No photos yet. Upload some above.</div>'}`;
  const drop = $('#drop');
  const handle = async files => {
    files = files.filter(f => f.type.startsWith('image/')); if (!files.length) return;
    drop.innerHTML = `<span class="spin"></span> Uploading ${files.length} photo${files.length>1?'s':''}…`;
    let sort = gal.reduce((m,g) => Math.max(m, g.sort||0), 0), ok = 0;
    for (const f of files){
      try {
        const u = await uploadImage(f, 'gallery');
        gal.push((await api('save', {url:u, sort:++sort, published:true}, {query:{t:'gallery'}})).row); ok++;
      } catch (err) { fail(err, 'Upload failed'); }
    }
    if (ok) toast(`${ok} photo${ok>1?'s':''} added`);
    drawGallery();
  };
  drop.onclick = async e => { e.preventDefault(); handle(await pickFile(true)); };
  drop.onkeydown = e => { if (e.key==='Enter' || e.key===' ') drop.click(); };
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); handle([...e.dataTransfer.files]); };
  $('#view').querySelectorAll('.gitem').forEach(el => {
    const g = gal.find(x => String(x.id)===el.dataset.id);
    const save = async (patch, msg) => {
      try { await api('save', Object.assign({id:g.id}, patch), {query:{t:'gallery'}}); } catch (err) { fail(err, 'Could not save'); return false; }
      Object.assign(g, patch); toast(msg); return true;
    };
    el.querySelector('[data-cap]').onchange = e => save({caption:e.target.value.trim() || null}, 'Caption saved');
    el.querySelector('[data-sort]').onchange = async e => { if (await save({sort:parseInt(e.target.value,10)||0}, 'Order saved')){ gal.sort((a,b) => a.sort-b.sort); drawGallery(); } };
    el.querySelector('[data-pub]').onchange = async e => { if (!await save({published:e.target.checked}, e.target.checked?'Now shown on website':'Hidden from website')) e.target.checked = !e.target.checked; };
    el.querySelector('[data-del]').onclick = async () => {
      if (!confirm('Delete this photo? This cannot be undone.')) return;
      try { await api('delete', {id:g.id}, {query:{t:'gallery'}}); } catch (err) { return fail(err, 'Could not delete'); }
      gal = gal.filter(x => x.id!==g.id); drawGallery(); toast('Photo deleted');
    };
  });
}

  <form class="cform" id="contentForm">
    ${SITE_GROUPS.map(([t,d,fs]) => `<section class="cgroup"><h2>${t}</h2>${d?`<p>${d}</p>`:''}<div class="g2">${fs.map(f => `<div style="${f.type==='textarea'||f.type==='image'?'grid-column:1/-1':''}">${fieldHtml(f, site[f.name])}</div>`).join('')}</div></section>`).join('')}
    <section class="cgroup"><h2>Highlight numbers</h2><p>The four boxes under the home page banner. Leave a number empty to hide that box.</p>
      ${stats.map((s,i) => `<div class="g2"><label class="f">Number ${i+1}<input class="input" name="stat_v_${i}" value="${esc(s.v)}" maxlength="30"></label><label class="f">Label ${i+1}<input class="input" name="stat_l_${i}" value="${esc(s.l)}" maxlength="80"></label></div>`).join('')}
    </section>
    <section class="cgroup"><h2>Branches</h2><p>Separate several phone numbers with commas.</p>
      <div id="branchRows" style="display:flex;flex-direction:column;gap:10px"></div>
      <button type="button" class="btn btn-line btn-sm" id="addBranch" style="align-self:flex-start">+ Add branch</button>
    </section>
    <section class="cgroup"><h2>Education loan points</h2><p>One point per line.</p>
      <textarea class="input" name="loans" style="min-height:150px">${esc(loans.join('\n'))}</textarea></section>
    <section class="cgroup"><h2>Program card descriptions</h2><p>The one-line text under each program in “What are you looking for?”.</p>
      <div class="g2">${DESC_KEYS.map(([k,l]) => `<label class="f">${esc(l)}<input class="input" name="desc_${k}" value="${esc(desc[k])}" maxlength="120"></label>`).join('')}</div></section>
    <div class="savebar"><button type="button" class="btn btn-line" id="resetContent">Discard changes</button><button type="submit" class="btn btn-navy">Save changes</button></div>
  </form>`;
  const form = $('#contentForm');
  wireImageFields(form);
  const rowHtml = b => `<div class="rep" data-branch><input class="input" placeholder="City" data-k="city" value="${esc(b.city)}" maxlength="60">
    <input class="input" placeholder="Address" data-k="address" value="${esc(b.address)}" maxlength="300">
    <input class="input" placeholder="Phones" data-k="phones" value="${esc((b.phones||[]).join(', '))}" maxlength="120">
    <button type="button" class="btn btn-danger icon-btn" data-rm aria-label="Remove branch">✕</button></div>`;
  const rowsEl = $('#branchRows');
  rowsEl.innerHTML = branches.map(rowHtml).join('');
  rowsEl.onclick = e => { const b = e.target.closest('[data-rm]'); if (b) b.closest('[data-branch]').remove(); };
  $('#addBranch').onclick = () => { rowsEl.insertAdjacentHTML('beforeend', rowHtml({})); rowsEl.lastElementChild.querySelector('input').focus(); };
  $('#resetContent').onclick = () => { if (confirm('Discard your unsaved changes?')) viewContent(); };
  form.onsubmit = async e => {
    e.preventDefault();
    const el = n => form.elements[n];
    const siteOut = Object.assign({}, site);
    SITE_GROUPS.forEach(g => g[2].forEach(f => { siteOut[f.name] = el(f.name).value.trim(); }));
    siteOut.stats = [0,1,2,3].map(i => ({v:el('stat_v_'+i).value.trim(), l:el('stat_l_'+i).value.trim()})).filter(s => s.v);
    const brOut = [...rowsEl.querySelectorAll('[data-branch]')].map(r => {
      const g = k => r.querySelector(`[data-k=${k}]`).value.trim();
      return {city:g('city'), address:g('address'), phones:g('phones').split(',').map(x => x.trim()).filter(Boolean)};
    }).filter(b => b.city);
    const loansOut = el('loans').value.split('\n').map(x => x.trim()).filter(Boolean);
    const descOut = Object.fromEntries(DESC_KEYS.map(([k]) => [k, el('desc_'+k).value.trim()]).filter(x => x[1]));
    const btn = form.querySelector('[type=submit]'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Saving';
    let ok = true;
    try { await api('content_save', {items:{site:siteOut, branches:brOut, loans:loansOut, program_desc:descOut}}); } catch (err) { ok = false; fail(err, 'Could not save'); }
    btn.disabled = false; btn.textContent = 'Save changes';
    if (!ok) return;
    toast('Website content saved — it is live now');
  };
}

/* ---------------- admins & password ---------------- */
async function viewAdmins(){
  let d; try { d = await api('admins'); } catch (err) { return fail(err, 'Could not load admins'); }
  const fmt = v => v ? new Date(v.replace(' ','T')).toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'}) : '—';
  $('#view').innerHTML = `
  <div class="head"><div><h1>Admins &amp; Password</h1><p>People who can sign in to this admin panel.</p></div><button class="btn btn-gold" id="addAdmin">+ Add admin</button></div>
  <div class="panel" style="margin-bottom:22px"><div class="tbl-wrap"><table style="min-width:560px">
    <thead><tr><th>Name</th><th>Email</th><th>Last sign-in</th><th></th></tr></thead>
    <tbody>${d.rows.map(a => `<tr data-id="${a.id}"><td><b>${esc(a.name)||'—'}</b>${a.id===d.me?' <span class="pill in">You</span>':''}</td><td>${esc(a.email)}</td><td>${esc(fmt(a.last_login))}</td>
      <td class="actions">${a.id===d.me?'':'<button class="btn btn-danger btn-sm" data-del>Remove</button>'}</td></tr>`).join('')}</tbody></table></div></div>
  <form class="cgroup" id="pwForm" style="max-width:520px"><h2>Change your password</h2>
    <label class="f">Current password<input class="input" type="password" name="current" required autocomplete="current-password"></label>
    <label class="f">New password <span class="hint">at least 8 characters</span><input class="input" type="password" name="new" required minlength="8" autocomplete="new-password"></label>
    <button class="btn btn-navy" type="submit" style="align-self:flex-start">Update password</button></form>`;
  $('#addAdmin').onclick = () => openForm('Add admin', [
      {name:'name', label:'Name', max:120}, {name:'email', label:'Email', type:'email', required:true, max:190},
      {name:'password', label:'Password', type:'password', required:true, hint:'at least 8 characters — share it with them privately', max:200}], {}, async v => {
    try { await api('admin_add', v); } catch (err) { fail(err, 'Could not add admin'); return false; }
    toast('Admin added'); viewAdmins(); return true;
  });
  $('#view').querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    const tr = b.closest('tr'), a = d.rows.find(x => String(x.id)===tr.dataset.id);
    if (!confirm(`Remove ${a.email}? They will no longer be able to sign in.`)) return;
    try { await api('admin_delete', {id:a.id}); } catch (err) { return fail(err, 'Could not remove'); }
    toast('Admin removed'); viewAdmins();
  });
  $('#pwForm').onsubmit = async e => {
    e.preventDefault(); const f = e.target;
    try { await api('password', {current:f.current.value, new:f.new.value}); } catch (err) { return fail(err, 'Password not changed'); }
    f.reset(); toast('Password updated');
  };
}

window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (v && v!==current && !$('#appScreen').classList.contains('hidden')) go(v); });
boot().catch(err => fail(err, 'Could not start'));
})();
</script>
